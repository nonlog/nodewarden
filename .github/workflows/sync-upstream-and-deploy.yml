name: Sync upstream release and deploy Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nodewarden-upstream-sync-deploy
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync latest upstream release
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/shuaiplus/nodewarden.git

          TAG="$(gh release view -R shuaiplus/nodewarden --json tagName --jq .tagName)"
          echo "Latest upstream release: $TAG"
          git fetch upstream "refs/tags/$TAG:refs/tags/$TAG"

          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "Fork already contains upstream release $TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git merge --no-edit "$TAG"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Cloudflare token
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set repository secret CLOUDFLARE_API_TOKEN before deploying."
            exit 1
          fi

      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Deploy Worker
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_ACCOUNT_ID: d7d7c67ac1a53a3b6d365554a6fc4016
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
